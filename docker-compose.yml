# PurrSkills Test Server - Docker Compose
# Provides: PostgreSQL database + Paper 1.21 Minecraft server

services:
  # PostgreSQL 17 — database for PurrCore/PurrSkills
  postgres:
    image: postgres:17
    container_name: purrskills-postgres
    environment:
      POSTGRES_DB: minecraft
      POSTGRES_USER: minecraft
      POSTGRES_PASSWORD: minecraft_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minecraft"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - minecraft-net

  # Paper 1.21 Minecraft Server
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: purrskills-minecraft
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.1"
      MEMORY: "2G"
      SERVER_NAME: "PurrSkills Test Server"
      MOTD: "PurrSkills Playtesting - DO NOT USE IN PRODUCTION"
      DIFFICULTY: "peaceful"
      MODE: "survival"
      PVP: "true"
      ONLINE_MODE: "false"  # Allow cracked clients for testing
      ENABLE_RCON: "true"
      RCON_PASSWORD: "minecraft"
      RCON_PORT: 25575
      # Server properties
      MAX_PLAYERS: 10
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 8
      SPAWN_PROTECTION: 0
      ALLOW_NETHER: "true"
      ALLOW_FLIGHT: "true"
    ports:
      - "25565:25565"  # Minecraft
      - "25575:25575"  # RCON
    volumes:
      - ./server:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minecraft-net
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  pg_data:
    driver: local

networks:
  minecraft-net:
    driver: bridge
