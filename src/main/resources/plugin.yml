name: PurrSkills
version: '1.0.0'
main: gay.nyaa.purrskills.PurrSkillsPlugin
api-version: '1.21'
depend: [PurrCore]
prefix: PurrSkills
author: flakesonnix
description: MCMMO-style skills system with XP, levels, and passive bonuses
website: https://github.com/flakesonnix/PurrSkills

commands:
  skills:
    description: View your skill levels
    usage: /skills [player]
    permission: purrskills.skills
    permission-message: You don't have permission!
  skillsmenu:
    description: Open the visual skills menu
    usage: /skillsmenu
    permission: purrskills.skills
    permission-message: You don't have permission!
  stats:
    description: View your stats from skills
    usage: /stats [player]
    permission: purrskills.stats
    permission-message: You don't have permission!

permissions:
  purrskills.skills:
    description: View your own skills
    default: true
  purrskills.skills.others:
    description: View other players' skills
    default: op
  purrskills.stats:
    description: View your own stats
    default: true
  purrskills.stats.others:
    description: View other players' stats
    default: op
  purrskills.leaderboard:
    description: View skill leaderboards
    default: true
