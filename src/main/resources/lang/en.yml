# PurrSkills English translations
prefix: "&7[&d&lPurrSkills&7]"

skills:
  # Skill names
  mining: "Mining"
  foraging: "Foraging"
  farming: "Farming"
  combat: "Combat"
  fishing: "Fishing"
  
  # XP gain message (actionbar)
  xp-gain: "&a+{xp} {skill} XP &7({current}/{required})"
  
  # Level up messages
  level-up: "&6&lLEVEL UP! &e{skill} &7→ &aLevel {level}"
  level-up-subtitle: "&7Keep grinding to unlock more bonuses!"
  
  # Command messages (legacy)
  skills-header: "&d&lYour Skills"
  skills-line: "&e{skill}: &7Level {level} &8({current}/{required} XP)"
  skills-other-header: "&d&l{player}'s Skills"
  
  # Errors
  player-not-found: "&cPlayer not found!"
  no-permission: "&cYou don't have permission to do that!"

# GUI messages
gui:
  skills:
    title: "&d&l{player}'s Skills"
    skill-name: "&e&l{skill} {level}"
    xp-progress: "&7Progress: &f{xp} &7/ &f{required} XP"
    progress-bar: "&a{filled}&7{empty} &f{percent}%"
    max-level: "&6&lMAX LEVEL"
    rewards-header: "&b&lRewards:"
    stat-line: "&7  • &f{stat}: &a+{value}"
    power-level-name: "&6&lPower Level"
    power-level-value: "&e{level}"

commands:
  skills:
    usage: "&cUsage: /skills [player]"
    player-only: "&cThis command can only be used by players."
    no-permission-others: "&cYou don't have permission to view other players' skills."
    player-not-found: "&cPlayer '{player}' not found."
    header: "&e&l{player}'s Skills"
    skill-line: "&7  {skill} &fLv {level} &7{xp} / {required} XP &8({percent}%)"
    power-level: "&6&lPower Level: &e{level}"
  
  stats:
    usage: "&cUsage: /stats [player]"
    player-only: "&cThis command can only be used by players."
    no-permission-others: "&cYou don't have permission to view other players' stats."
    player-not-found: "&cPlayer '{player}' not found."
    header: "&e&l{player}'s Stats"
    category-mining: "&b&lMining Stats"
    category-combat: "&c&lCombat Stats"
    category-farming: "&a&lFarming Stats"
    category-foraging: "&2&lForaging Stats"
    category-fishing: "&9&lFishing Stats"
    category-general: "&f&lGeneral Stats"
    stat-line: "&7  {stat}: &f{value} &a({bonus})"

# Stat names (used by StatsCommand)
stats:
  mining-speed: "Mining Speed"
  mining-fortune: "Mining Fortune"
  health: "Health"
  damage: "Damage"
  strength: "Strength"
  defense: "Defense"
  crit-chance: "Crit Chance"
  crit-damage: "Crit Damage"
  farming-fortune: "Farming Fortune"
  farming-speed: "Farming Speed"
  foraging-fortune: "Foraging Fortune"
  foraging-speed: "Foraging Speed"
  fishing-speed: "Fishing Speed"
  sea-creature-chance: "Sea Creature Chance"
  speed: "Speed"
  magic-find: "Magic Find"
